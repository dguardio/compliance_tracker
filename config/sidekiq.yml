# Sidekiq configuration file
# See https://github.com/sidekiq/sidekiq/wiki/Configuration

:concurrency: 5
:queues:
  - default
  - mailers

# Schedule for recurring jobs
# See https://github.com/sidekiq-scheduler/sidekiq-scheduler
:scheduler:
  :schedule:
    scrape_regulations_job:
      cron: '*/1 * * * *' # Runs every minute for testing
      class: ScrapeRegulationsJob
      queue: default
      description: "Scrapes all regulatory authorities for new and updated regulations."
